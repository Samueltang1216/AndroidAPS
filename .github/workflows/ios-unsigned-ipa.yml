name: Build unsigned iOS AAPSClient IPA

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ios-unsigned-ipa.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Cache Kotlin Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Generate iOS version
        run: ./gradlew --console=plain --no-daemon :ios:shell:generateIosVersionXcconfig

      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild -project ios/app/AAPSClient.xcodeproj \
            -scheme AAPSClient \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/aaps-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/aaps-ios-build.log"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/aaps-derived/Build/Products/Release-iphoneos/AAPSClient.app"
          test -d "$app"
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Info.plist")
          test "$version" = '4.0.0'
          mkdir -p dist/Payload
          cp -R "$app" dist/Payload/
          cd dist
          ditto -c -k --keepParent Payload AAPSClient-4.0.0-unsigned.ipa
          unzip -t AAPSClient-4.0.0-unsigned.ipa | tail -1
          shasum -a 256 AAPSClient-4.0.0-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AAPSClient-4.0.0-unsigned-ipa
          path: dist/AAPSClient-4.0.0-unsigned.ipa
          if-no-files-found: error

